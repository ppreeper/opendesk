[defaults]
# Desktop-first inventory; run the CLI from the repository root so these
# relative paths resolve correctly (the CLI does this for you).
inventory = inventory/all/hosts.yml
roles_path = playbooks/roles
collections_path = collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
nocows = 1

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

